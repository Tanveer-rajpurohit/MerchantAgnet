id: custom-code-hardcoded-secrets

info:
  name: Plaintext Secret & Token Leak in Source Code
  author: tanveer
  severity: high
  description: Scans local files for unmasked API tokens, Razorpay keys, database credentials, and hardcoded secrets.
  tags: custom,code,secrets
  remediation: Move credentials into apps/backend/.env and reference via os.environ. Ensure .env is listed in .gitignore.

file:
  - extensions:
      - ts
      - tsx
      - js
      - py
      - json

    matchers-condition: or
    matchers:
      - type: regex
        name: razorpay-key
        regex:
          - "rzp_test_[0-9a-zA-Z]+"
          - "rzp_live_[0-9a-zA-Z]+"

      - type: regex
        name: api-secret-key
        regex:
          - "sk_test_[0-9a-zA-Z]+"
          - "sk_live_[0-9a-zA-Z]+"

      - type: regex
        name: jwt-secret
        regex:
          - "JWT_SECRET[_KEY]*\\s*=\\s*[\"'][^\"']{8,}[\"']"

      - type: regex
        name: database-password
        regex:
          - "postgresql://[^\\s]+:[^@\\s]+@"

      - type: regex
        name: sarvam-api-key
        regex:
          - "sarvam[_-]?api[_-]?key\\s*=\\s*[\"'][^\"']+[\"']"

    extractors:
      - type: regex
        name: leaked-secret
        regex:
          - "rzp_test_[0-9a-zA-Z]+"
          - "rzp_live_[0-9a-zA-Z]+"
          - "sk_test_[0-9a-zA-Z]+"
          - "sk_live_[0-9a-zA-Z]+"
